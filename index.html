  label: "SAMSUNG, Revolutionizing Support with AI-Driven Videos",
  cover: "radial-gradient(60% 55% at 28% 22%,rgba(255,255,255,.4),transparent 60%),radial-gradient(90% 90% at 85% 95%,#091266,transparent 60%),linear-gradient(135deg,#1428a0,#3b6fe0)",
  meta: "Samsung · AI Video · Direction",
  tags: ["AI Video", "Motion", "Support"],
  body: "Samsung Support had a massive library of how-to videos, and the usual way of making them was slow going. As Creative Lead, I wanted to find out whether AI could help us make them better and faster, without the content ending up colder or off-brand.\n\nWe brought in AI avatars to front the how-to videos, which let us turn them around much quicker while keeping the same look and tone across the board. AI transcription handled the more tedious parts of the process, so the team could put its time into the things that actually needed a human eye.\n\nIt was built to travel, with the idea of rolling it out across different markets, and we kept an eye on the numbers to see what was landing with people and what wasn't.\n\nMore than anything it was a way of letting AI take the heavy lifting, so the support content could be clearer, quicker to make, and a little easier to actually use."
}, {
  id: "sam-planet",
  short: "SAMSUNG, From Planet to Galaxy",
  img: null,

  cover: "radial-gradient(45% 45% at 70% 30%,#43e3ff,transparent 55%),radial-gradient(120% 120% at 20% 90%,#020024,transparent),linear-gradient(140deg,#04003a,#090979)",
  meta: "Samsung · Integrated Campaign",
  tags: ["Campaign", "Creative Direction", "Film"],
  body: "The brief was the move to Samsung, the kind of thing that usually gets sold as a list of features. I wanted something bigger to hang it on, so the idea became From Planet to Galaxy, built around one question, what if your world was bigger? You start on a familiar planet where everything works, and right next to it sits a whole galaxy you have not explored yet, so changing ecosystem reads as a journey outwards rather than a phone upgrade.\n\nThe film was meant to be a hook, not a manual. Rather than spelling out every feature it sets the tone and points people to the Samsung pages where the phones are explained in full, so it only had to carry the feeling of more, more room to create, sharper cameras, more ways to work and connect, and Smart Switch taking the fear out of moving.\n\nAs Creative Director I developed the concept and the narrative, supervised the main film, and art directed the digital, banner and retail pieces, keeping the look and tone consistent across the campaign."
}, {

  short: "SAMSUNG, Award Templates",
  img: null,
  seamless: true,
  mediaPad: true,
  label: "SAMSUNG, Award Templates",
  cover: "radial-gradient(70% 60% at 30% 20%,rgba(255,255,255,.35),transparent 55%),linear-gradient(135deg,#d8b9a8,#7d5a52)",
  meta: "Samsung · Design System",
  tags: ["Templates", "Design System"],
  body: "Across Europe, each market was celebrating its local service and support awards in its own way, so the banners, videos and emails looked different from one country to the next.\n\nI pulled it together into one visual system for the whole region, built so any market could pick it up and run with it. I took Samsung’s palette somewhere softer and more approachable, paired it with a bold, eye-catching look that drops easily into any format, from a web banner to a mobile story to an email.\n\nAs Creative Lead I shaped the direction throughout, so wherever an award turned up across Europe, it felt like one brand with one voice."
}, {
  id: "randstad",
  short: "Randstad, AI Visuals",
  img: null,

  label: "Randstad, AI Visuals for Promotional Impact",
  cover: "radial-gradient(60% 60% at 75% 25%,#7ab8ff,transparent 55%),linear-gradient(135deg,#13267a,#2d6cdf)",
  meta: "Randstad · AI Visuals",
  tags: ["Adobe Firefly", "Branding", "Localisation"],
  body: "I worked with Randstad on a promotional project built around Adobe Firefly, using its AI to create and edit the branded visuals. The point was to speed up production and make everything easy to localise for different markets and countries, since the AI let us adapt and edit images quickly rather than redoing each one from scratch. It meant we could turn out striking banners that still looked unmistakably like Randstad, with the whole thing running faster and far more flexible than usual."
}, {
  id: "movistar",

  meta: "Movistar Plus+ · Art Direction & Design",
  tags: ["CRM", "TV Interface", "Campaigns"],
  body: "I worked on the visual side of Movistar Plus+ as art director and designer, moving across quite a few fronts at once: CRM, the TV experience, and the digital campaigns that brought people in.\n\nA lot of it lived in the email marketing, shaping how those campaigns looked and felt and keeping them recognisably Movistar while adapting each one to different audiences and the moment it would land in.\n\nI also designed a good part of what you see on screen inside the product, the visuals that set the tone and help you find something worth watching.\n\nAround all that ran a steady stream of digital marketing: display banners, social pieces for the big moments like Black Friday, and work that had to look right and actually perform."
}, {
  id: "sam-cpc",
  short: "SAMSUNG CPC",

  meta: "Samsung · TikTok · Social",
  tags: ["TikTok", "Pixel Art", "Characters"],
  body: "Samsung wanted to open a door to a younger generation, so we built Protect Your Galaxy, a series made to live on TikTok. The idea was simple, take the usual how to video and turn it into something people would actually want to watch, short clips that reveal the hidden features of your phone in a way that feels like play rather than a manual.\n\nTo carry it we created a little world with its own cast. On a planet full of threats, our hero Sam sets out to protect her Galaxy through a series of missions, discovering hidden places, taking those missions to other worlds, and sharing everything she learns along the way. The pixel art look gave it a game feel that matched both the platform and the audience."

  short: "CPC, Social & Community",

  seamless: true,

.thumb{position:relative;overflow:hidden;background-size:cover;background-position:center;display:inline-block;box-shadow:0 10px 22px rgba(15,15,35,0.4),0 2px 5px rgba(15,15,35,0.3);}
.thumb-img{display:block;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 22px rgba(15,15,35,0.4),0 2px 5px rgba(15,15,35,0.3);}
.cover-frame{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.28),inset 0 0 0 1.5px rgba(255,255,255,0.06);}

.desk-label{display:inline-block;font-size:11px;font-weight:700;line-height:1.3;text-align:center;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:7px;color:#fff;max-width:160px;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:none;
  background:rgba(30,30,34,0.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 0 0 0.5px rgba(255,255,255,0.18),0 2px 8px rgba(0,0,0,0.12);text-shadow:0 1px 2px rgba(0,0,0,0.4);transition:background .15s ease;}

/* windows */
.window{position:absolute;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:rgba(252,252,253,0.86);backdrop-filter:blur(34px) saturate(185%);-webkit-backdrop-filter:blur(34px) saturate(185%);box-shadow:0 1px 1px rgba(0,0,0,0.04),0 22px 42px -12px rgba(20,20,50,0.4),0 48px 90px -20px rgba(20,20,50,0.34),0 0 0 0.5px rgba(0,0,0,0.14);transition:box-shadow .25s ease;}
.window.focused{box-shadow:0 1px 1px rgba(0,0,0,0.05),0 30px 56px -12px rgba(20,20,50,0.5),0 60px 110px -22px rgba(20,20,50,0.42),0 0 0 0.5px rgba(0,0,0,0.18);}
.win-opening{animation:winIn .3s cubic-bezier(.2,.9,.3,1.04);}
.win-closing{animation:winOut .22s ease forwards;pointer-events:none;}
.win-minimizing{animation:winMin .35s cubic-bezier(.5,0,.7,.4) forwards;pointer-events:none;}
@keyframes winIn{from{opacity:0;transform:scale(.93);}to{opacity:1;transform:scale(1);}}
@keyframes winOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.95);}}
@keyframes winMin{from{opacity:1;transform:scale(1);}to{opacity:0;transform:translateY(60vh) scale(.16);}}
.titlebar{height:42px;flex-shrink:0;display:flex;align-items:center;padding:0 15px;cursor:grab;background:rgba(255,255,255,0.4);border-bottom:0.5px solid rgba(0,0,0,0.08);}

.window:hover .resize-handle::after{opacity:1;}

.dock-tip{position:absolute;bottom:calc(100% + 13px);left:50%;transform:translateX(-50%);background:rgba(40,40,45,0.94);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease;}

/* Menu bar (macOS style) */
.menubar{position:absolute;top:0;left:0;right:0;height:28px;z-index:100003;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));font-size:13px;color:#1d1d1f;}
.menubar::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:rgba(238,238,240,0.62);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0.5px 0 rgba(0,0,0,0.14);}
.mb-left,.mb-right{display:flex;align-items:center;height:100%;min-width:0;}
.mb-wrap{position:relative;height:100%;display:flex;align-items:center;}

.mb-btn.open{background:rgba(0,0,0,0.12);}
.mb-app{font-weight:700;}
.mb-logo{padding:0 11px;}
.mb-logo svg{height:13px;width:auto;display:block;fill:currentColor;}
.mb-drop{position:absolute;top:26px;left:0;min-width:236px;max-height:calc(100vh - 40px);overflow-y:auto;padding:5px;border-radius:10px;z-index:2;
  background:rgba(246,246,248,0.9);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 0 0 0.5px rgba(0,0,0,0.16),0 14px 34px -6px rgba(0,0,0,0.32);animation:mbIn .12s ease-out;}
@keyframes mbIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
.mb-item{display:block;width:100%;text-align:left;padding:4px 10px;border:0;border-radius:5px;background:none;font:inherit;font-size:13px;line-height:1.35;color:#1d1d1f;cursor:pointer;white-space:nowrap;text-decoration:none;}
.mb-item:hover,.mb-item:focus-visible{background:#0a7cff;color:#fff;outline:none;}
.mb-sep{height:1px;margin:5px 10px;background:rgba(0,0,0,0.12);}
.mb-status{display:flex;align-items:center;gap:7px;padding:0 12px;white-space:nowrap;}
.mb-dot{width:7px;height:7px;border-radius:50%;background:#28b955;box-shadow:0 0 0 3px rgba(40,185,85,0.2);}
.mb-clock{padding:0 4px 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.mb-city{color:#55555b;}
.shut{position:fixed;inset:0;z-index:100010;background:#000;color:#f5f5f7;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;letter-spacing:.2px;animation:shutIn .45s ease both;}
.shut-out{animation:shutOut .7s ease forwards;}
@keyframes shutIn{from{opacity:0;}to{opacity:1;}}
@keyframes shutOut{from{opacity:1;}to{opacity:0;}}

/* About This Designer */
.atd{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%;padding:28px 26px 16px;}
.atd-photo{width:128px;height:128px;flex:0 0 auto;border-radius:50%;background:#ddd url("avatar-dog.jpg") no-repeat center/cover;
  box-shadow:0 8px 22px rgba(0,0,0,0.22),0 0 0 0.5px rgba(0,0,0,0.2);}
.atd-name{font-size:24px;font-weight:700;letter-spacing:-0.3px;margin:16px 0 2px;}
.atd-sub{font-size:13px;color:#6e6e73;margin-bottom:18px;}
.atd-specs{display:grid;grid-template-columns:auto auto;justify-content:center;gap:5px 12px;margin:0 0 20px;font-size:12.5px;line-height:1.35;text-align:left;}
.atd-specs dt{font-weight:600;text-align:right;color:#1d1d1f;}
.atd-specs dd{margin:0;color:#48484d;}
.atd-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.atd-btn{display:inline-block;padding:5px 14px;border-radius:6px;border:0;font:inherit;font-size:13px;line-height:1.4;color:#1d1d1f;background:#fff;cursor:pointer;text-decoration:none;
  box-shadow:0 0 0 0.5px rgba(0,0,0,0.2),0 1px 2px rgba(0,0,0,0.08);}
.atd-btn.primary{background:#0a7cff;color:#fff;box-shadow:none;}
.atd-foot{margin-top:auto;padding-top:18px;font-size:10.5px;color:#8e8e93;}

/* Welcome notification (macOS style, first visit only) */
.notif{position:fixed;top:38px;right:14px;z-index:100001;width:384px;max-width:calc(100vw - 28px);display:flex;gap:11px;align-items:flex-start;padding:13px 16px 14px 16px;border-radius:18px;cursor:pointer;color:#1d1d1f;
  background:rgba(246,246,248,0.80);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 0 0 0.5px rgba(0,0,0,0.13),0 14px 40px -8px rgba(20,20,40,0.38),0 2px 6px rgba(0,0,0,0.08);}
.notif-in{animation:notifIn .6s cubic-bezier(.2,.9,.25,1.04) both;}
.notif-out{animation:notifOut .32s ease forwards;}
@keyframes notifIn{from{opacity:0;transform:translateX(calc(100% + 30px));}to{opacity:1;transform:none;}}
@keyframes notifOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateX(calc(100% + 30px));}}
.notif-body{min-width:0;flex:1;}
.notif-head{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.3px;color:#6e6e73;margin-bottom:3px;}
.notif-title{font-size:13.5px;font-weight:700;line-height:1.3;}
.notif-text{font-size:13px;line-height:1.4;color:#3a3a3c;margin-top:2px;text-wrap:pretty;}
.notif-close{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;font-size:14px;line-height:22px;color:#444;
  background:rgba(250,250,252,0.96);box-shadow:0 0 0 0.5px rgba(0,0,0,0.2),0 2px 6px rgba(0,0,0,0.16);opacity:0;transition:opacity .15s ease;}
.notif:hover .notif-close{opacity:1;}
@media (hover: none){.notif-close{opacity:1;}}
@media (max-width: 768px){
  .notif{top:38px;left:10px;right:10px;width:auto;max-width:none;}
  .notif-in{animation-name:notifInTop;}.notif-out{animation-name:notifOutTop;}
}
@keyframes notifInTop{from{opacity:0;transform:translateY(calc(-100% - 20px));}to{opacity:1;transform:none;}}
@keyframes notifOutTop{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(calc(-100% - 20px));}}
@media (prefers-reduced-motion: reduce){.notif-in,.notif-out{animation-duration:.01s;}}

/* Window text can be selected and copied (emails, names, project info) */
.window-body p,.window-body h1,.window-body h2,.window-body h3,.window-body li,.window-body a,.form-note{-webkit-user-select:text;user-select:text;}
/* Touch screens: dock labels flash briefly on tap instead of staying stuck over the content */
@keyframes tipFlash{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
@media (hover: none){.dock-item:hover .dock-tip{opacity:0;animation:tipFlash 1.6s ease forwards;}}

/* ============================ DESKTOP LOCK SCREEN ============================ */
.dl{position:fixed;inset:0;z-index:100020;overflow:hidden;cursor:pointer;outline:none;background:#e9e9e9;}
.dl-out{animation:dlOut .62s cubic-bezier(.5,0,.3,1) forwards;pointer-events:none;}
@keyframes dlOut{from{opacity:1;transform:none;filter:none;}to{opacity:0;transform:scale(1.04);filter:blur(8px);}}
.dl-veil{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,0.38) 100%);}
.dl-head{position:absolute;z-index:2;top:5.5vh;left:0;right:0;text-align:center;color:#e70e0e;}
.dl-date{font-size:clamp(17px,2.4vh,24px);font-weight:600;letter-spacing:.2px;}
.dl-time{font-size:clamp(64px,12vh,128px);font-weight:700;line-height:1;letter-spacing:-0.03em;margin-top:2px;font-variant-numeric:tabular-nums;}
.dl-user{position:absolute;z-index:2;left:0;right:0;bottom:8vh;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;}
.dl-avatar{width:76px;height:76px;border-radius:50%;background:#ddd url("avatar-dog.jpg") no-repeat center/cover;box-shadow:0 6px 20px rgba(0,0,0,0.35),0 0 0 2px rgba(255,255,255,0.55);}
.dl-name{font-size:17px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.5);}
.dl-field{display:flex;align-items:center;gap:12px;height:34px;padding:0 5px 0 16px;border-radius:17px;font-size:13.5px;color:rgba(255,255,255,0.94);
  background:rgba(255,255,255,0.22);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.38);}
.dl-go{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.3);}

.dl-hint{font-size:12px;color:rgba(255,255,255,0.72);text-shadow:0 1px 3px rgba(0,0,0,0.4);}
.dl:hover .dl-field{background:rgba(255,255,255,0.3);}

/* lock screen notifications (phone + desktop) */
.ln-wrap{display:flex;flex-direction:column;gap:8px;}
.ln{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px 12px 11px;border:0;border-radius:20px;text-align:left;font:inherit;color:#1d1d1f;cursor:pointer;
  background:rgba(246,246,248,0.84);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 8px 24px -8px rgba(0,0,0,0.35);animation:lnIn .75s cubic-bezier(.2,.9,.25,1.04) both;}
@keyframes lnIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:none;}}
.ln:hover{background:rgba(250,250,252,0.92);}

.ln-avatar{display:block;width:100%;height:100%;background:#ddd url("avatar-dog.jpg") no-repeat center/cover;}
.ln-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.ln-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}

.ln-text{margin-top:1px;font-size:14px;line-height:1.35;color:#3a3a3c;}
.ph-notes{position:absolute;z-index:2;left:10px;right:10px;bottom:calc(112px + env(safe-area-inset-bottom));}
@container (max-height: 700px){.ph-notes .ln:nth-child(4){display:none;}}
.dl-notes{position:absolute;z-index:3;right:24px;bottom:24px;width:370px;}
@media (max-width: 1100px){.dl-notes{right:auto;left:50%;transform:translateX(-50%);bottom:calc(8vh + 196px);width:min(380px,calc(100vw - 32px));}}

/* phone: slide to power off */
.ph-off-ov{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(70px + env(safe-area-inset-top)) 0 calc(70px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,0.5);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);animation:phFade .25s ease both;}
.ph-off-track{position:relative;width:300px;max-width:calc(100% - 60px);height:64px;border-radius:32px;background:rgba(255,255,255,0.2);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.25);}
.ph-off-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:56px;font-size:17px;font-weight:500;pointer-events:none;
  color:transparent;background:linear-gradient(90deg,rgba(255,255,255,0.45) 0%,#fff 50%,rgba(255,255,255,0.45) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:phShimmer 2.4s linear infinite;}
@keyframes phShimmer{from{background-position:100% 0;}to{background-position:-100% 0;}}
.ph-off-knob{position:absolute;left:4px;top:4px;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#fff;color:#ff3b30;cursor:grab;touch-action:none;transition:transform .28s cubic-bezier(.2,.9,.3,1);}

.ph-off-x{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;font-size:22px;background:rgba(255,255,255,0.2);}
.ph-set-btn{width:100%;border:0;background:none;font:inherit;font-size:16px;cursor:pointer;}

/* ============================ iPHONE VERSION ============================ */
.ph{position:fixed;inset:0;overflow:hidden;container-type:size;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#1d1d1f;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}

.ph-veil{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 42%,rgba(0,0,0,0.3) 70%,rgba(0,0,0,0.42) 100%);}
@keyframes phFade{from{opacity:0;}to{opacity:1;}}

/* phone-only versions of the small-screen rules (independent of media queries) */
.ph .wallpaper{background-image:none;background:${MOBILE_BG};background-size:cover;background-position:center;}
.ph .aboutwin{flex-direction:column;}
.ph .aboutwin-side{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;gap:6px;border-right:0;border-bottom:0.5px solid rgba(0,0,0,0.1);padding:8px 12px;overflow-x:auto;}
.ph .aboutwin-side-title{display:none;}

.ph .sketch-head{flex-wrap:wrap;row-gap:10px;}
.ph .sketch-tools{flex-wrap:wrap;}
.ph .free-card{flex-direction:column;align-items:stretch;}.ph .free-thumb{width:100%;height:150px;flex:0 0 auto;}.ph .free-info{min-width:0;width:100%;}

/* home screen */
.ph-home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.ph-home-hidden{opacity:0;}
.ph-home-enter{animation:phHomeIn .6s cubic-bezier(.2,.85,.25,1) both;}
@keyframes phHomeIn{from{opacity:0;transform:scale(1.1);}to{opacity:1;transform:none;}}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px;padding:0 12px;margin-bottom:22px;}
.ph-app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border:0;background:none;padding:0;font:inherit;cursor:pointer;}
.ph-app:active .ph-ico{transform:scale(.92);filter:brightness(.85);}
.ph-ico{position:relative;display:block;flex:0 0 auto;width:60px;height:60px;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.22);transition:transform .12s ease,filter .12s ease;}
.ph-ico > img{position:absolute;left:-3.4%;top:-3.4%;width:106.8%;height:106.8%;object-fit:cover;}
.ph-ico > svg{display:block;width:100%;height:100%;}

.ph-ico-error > img{left:14%;top:12%;width:72%;height:72%;object-fit:contain;}
.ph-ico-cover{background-size:cover;background-position:center;}
.ph-label{max-width:82px;font-size:12px;font-weight:500;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,0.7),0 0 8px rgba(0,0,0,0.35);}
.ph-folder-ico{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px;background:rgba(255,255,255,0.3);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.35),0 3px 10px rgba(0,0,0,0.18);}
.ph-mini{display:block;border-radius:3px;overflow:hidden;background-size:cover;background-position:center;aspect-ratio:1;}
.ph-mini svg{display:block;width:100%;height:100%;}
.ph-searchpill{align-self:center;display:flex;align-items:center;gap:6px;height:30px;padding:0 15px;margin-bottom:14px;border:0;border-radius:15px;color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.28);}
.ph-searchpill svg{width:14px;height:14px;}
.ph-dock{display:grid;grid-template-columns:repeat(4,1fr);margin:0 10px;padding:14px 4px 10px;border-radius:34px;
  background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.28);}
.ph-dock .ph-label{font-size:11px;}

/* lock screen */
.ph-lock{position:absolute;inset:0;z-index:50;overflow:hidden;cursor:pointer;outline:none;background:#e9e9e9;}
.ph-lock-out{animation:phLockOut .52s cubic-bezier(.6,0,.3,1) forwards;}
@keyframes phLockOut{from{transform:none;opacity:1;}to{transform:translateY(-100%);opacity:0.4;}}
.ph-lock-head{position:absolute;z-index:2;top:calc(2.4vh + env(safe-area-inset-top));top:calc(2.4cqh + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#e70e0e;}
.ph-lock-pad{width:15px;height:15px;margin-bottom:4px;}
.ph-lock-date{font-size:clamp(15px,2.3vh,19px);font-size:clamp(15px,2.3cqh,19px);font-weight:600;letter-spacing:.2px;}
.ph-lock-time{font-size:clamp(56px,10.4vh,92px);font-size:clamp(56px,10.4cqh,92px);font-weight:700;line-height:1;letter-spacing:-0.03em;margin-top:2px;font-variant-numeric:tabular-nums;}
.ph-lock-notif{position:absolute;z-index:2;left:10px;right:10px;bottom:calc(118px + env(safe-area-inset-bottom));padding:13px 16px 14px;border-radius:20px;text-align:left;color:#1d1d1f;
  background:rgba(246,246,248,0.82);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 10px 30px -8px rgba(0,0,0,0.35);animation:phNotifIn .7s .35s cubic-bezier(.2,.9,.25,1.04) both;}
@keyframes phNotifIn{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:none;}}
.ph-lock-foot{position:absolute;z-index:2;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;padding:0 44px;}
.ph-lock-btn{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:50%;color:#fff;background:rgba(0,0,0,0.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.ph-lock-btn svg{width:22px;height:22px;}
.ph-lock-hint{font-size:13px;font-weight:600;color:rgba(255,255,255,0.88);animation:phHint 2.4s ease-in-out infinite;}
@keyframes phHint{0%,100%{opacity:.55;}50%{opacity:1;}}
.ph-homeind{position:absolute;z-index:2;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,0.92);transform:translateX(-50%);}

/* apps (full screen) */
.ph-view{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;overflow:hidden;background:#fbfbfd;animation:phOpen .42s cubic-bezier(.2,.85,.25,1) both;}

.ph-nav{flex:0 0 auto;position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;
  background:rgba(250,250,252,0.9);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:0.5px solid rgba(0,0,0,0.12);}
.ph-view-grey .ph-nav{background:rgba(242,242,247,0.92);}
.ph-back{justify-self:start;display:flex;align-items:center;gap:4px;max-width:140px;padding:6px 8px;border:0;background:none;color:#0a7cff;font:inherit;font-size:17px;cursor:pointer;}

.ph-homebar{position:absolute;z-index:3;left:50%;bottom:0;transform:translateX(-50%);display:flex;justify-content:center;align-items:flex-start;width:180px;height:calc(22px + env(safe-area-inset-bottom));padding:9px 0 0;border:0;background:none;cursor:pointer;}

/* My Work */
.ph-work{padding:6px 16px 20px;}

/* Search */
.ph-search-ov{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);

.ph-search-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;background:none;font:inherit;color:#1d1d1f;text-align:left;cursor:pointer;}

.ph-search-row > span:last-child{display:flex;flex-direction:column;min-width:0;}
.ph-search-ico{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:9px;overflow:hidden;background-size:cover;background-position:center;}
.ph-search-ico > img{position:absolute;left:-3.4%;top:-3.4%;width:106.8%;height:106.8%;object-fit:cover;}
.ph-search-ico > svg{display:block;width:100%;height:100%;}
.ph-search-t{font-size:15px;font-weight:600;line-height:1.25;}
.ph-search-m{font-size:12.5px;color:#8e8e93;margin-top:1px;}
.ph-search-empty{margin-top:40px;font-size:15px;color:rgba(255,255,255,0.85);text-align:center;}

/* Error as an iOS alert */
.ph-alert-ov{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);animation:phFade .2s ease both;}
.ph-alert{width:280px;border-radius:16px;overflow:hidden;text-align:center;background:rgba(242,242,247,0.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);animation:phAlertIn .28s cubic-bezier(.2,.9,.25,1.1) both;}
@keyframes phAlertIn{from{opacity:0;transform:scale(1.15);}to{opacity:1;transform:none;}}
.ph-alert-body{padding:20px 18px 16px;}
.ph-alert-ico{width:44px;height:44px;margin-bottom:8px;}
.ph-alert-title{font-size:17px;font-weight:700;line-height:1.3;}
.ph-alert-text{margin:6px 0 0;font-size:13px;line-height:1.4;color:#3a3a3c;}

@media (prefers-reduced-motion: reduce){.ph-view,.ph-view-out,.ph-push,.ph-pop,.ph-home-enter,.ph-lock-out,.ph-folder-panel,.ph-lock-notif,.ph-alert{animation-duration:.01s !important;}}
