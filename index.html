  label: "SAMSUNG, Revolutionizing Support with AI-Driven Videos",
  cover: "radial-gradient(60% 55% at 28% 22%,rgba(255,255,255,.4),transparent 60%),radial-gradient(90% 90% at 85% 95%,#091266,transparent 60%),linear-gradient(135deg,#1428a0,#3b6fe0)",
  meta: "Samsung · AI Video · Direction",
  tags: ["AI Video", "Motion", "Support"],
  body: "Samsung Support had a massive library of how-to videos, and the usual way of making them was slow going. As Creative Lead, I wanted to find out whether AI could help us make them better and faster, without the content ending up colder or off-brand.\n\nWe brought in AI avatars to front the how-to videos, which let us turn them around much quicker while keeping the same look and tone across the board. AI transcription handled the more tedious parts of the process, so the team could put its time into the things that actually needed a human eye.\n\nIt was built to travel, with the idea of rolling it out across different markets, and we kept an eye on the numbers to see what was landing with people and what wasn't.\n\nMore than anything it was a way of letting AI take the heavy lifting, so the support content could be clearer, quicker to make, and a little easier to actually use."
}, {
  id: "sam-planet",
  short: "SAMSUNG, From Planet to Galaxy",
  img: null,

  cover: "radial-gradient(45% 45% at 70% 30%,#43e3ff,transparent 55%),radial-gradient(120% 120% at 20% 90%,#020024,transparent),linear-gradient(140deg,#04003a,#090979)",
  meta: "Samsung · Integrated Campaign",
  tags: ["Campaign", "Creative Direction", "Film"],
  body: "The brief was the move to Samsung, the kind of thing that usually gets sold as a list of features. I wanted something bigger to hang it on, so the idea became From Planet to Galaxy, built around one question, what if your world was bigger? You start on a familiar planet where everything works, and right next to it sits a whole galaxy you have not explored yet, so changing ecosystem reads as a journey outwards rather than a phone upgrade.\n\nThe film was meant to be a hook, not a manual. Rather than spelling out every feature it sets the tone and points people to the Samsung pages where the phones are explained in full, so it only had to carry the feeling of more, more room to create, sharper cameras, more ways to work and connect, and Smart Switch taking the fear out of moving.\n\nAs Creative Director I developed the concept and the narrative, supervised the main film, and art directed the digital, banner and retail pieces, keeping the look and tone consistent across the campaign."
}, {

  short: "SAMSUNG, Award Templates",
  img: null,
  seamless: true,
  mediaPad: true,
  label: "SAMSUNG, Award Templates",
  cover: "radial-gradient(70% 60% at 30% 20%,rgba(255,255,255,.35),transparent 55%),linear-gradient(135deg,#d8b9a8,#7d5a52)",
  meta: "Samsung · Design System",
  tags: ["Templates", "Design System"],
  body: "Across Europe, each market was celebrating its local service and support awards in its own way, so the banners, videos and emails looked different from one country to the next.\n\nI pulled it together into one visual system for the whole region, built so any market could pick it up and run with it. I took Samsung’s palette somewhere softer and more approachable, paired it with a bold, eye-catching look that drops easily into any format, from a web banner to a mobile story to an email.\n\nAs Creative Lead I shaped the direction throughout, so wherever an award turned up across Europe, it felt like one brand with one voice."
}, {
  id: "randstad",
  short: "Randstad, AI Visuals",
  img: null,

  label: "Randstad, AI Visuals for Promotional Impact",
  cover: "radial-gradient(60% 60% at 75% 25%,#7ab8ff,transparent 55%),linear-gradient(135deg,#13267a,#2d6cdf)",
  meta: "Randstad · AI Visuals",
  tags: ["Adobe Firefly", "Branding", "Localisation"],
  body: "I worked with Randstad on a promotional project built around Adobe Firefly, using its AI to create and edit the branded visuals. The point was to speed up production and make everything easy to localise for different markets and countries, since the AI let us adapt and edit images quickly rather than redoing each one from scratch. It meant we could turn out striking banners that still looked unmistakably like Randstad, with the whole thing running faster and far more flexible than usual."
}, {
  id: "movistar",

  meta: "Movistar Plus+ · Art Direction & Design",
  tags: ["CRM", "TV Interface", "Campaigns"],
  body: "I worked on the visual side of Movistar Plus+ as art director and designer, moving across quite a few fronts at once: CRM, the TV experience, and the digital campaigns that brought people in.\n\nA lot of it lived in the email marketing, shaping how those campaigns looked and felt and keeping them recognisably Movistar while adapting each one to different audiences and the moment it would land in.\n\nI also designed a good part of what you see on screen inside the product, the visuals that set the tone and help you find something worth watching.\n\nAround all that ran a steady stream of digital marketing: display banners, social pieces for the big moments like Black Friday, and work that had to look right and actually perform."
}, {
  id: "sam-cpc",
  short: "SAMSUNG CPC",

  meta: "Samsung · TikTok · Social",
  tags: ["TikTok", "Pixel Art", "Characters"],
  body: "Samsung wanted to open a door to a younger generation, so we built Protect Your Galaxy, a series made to live on TikTok. The idea was simple, take the usual how to video and turn it into something people would actually want to watch, short clips that reveal the hidden features of your phone in a way that feels like play rather than a manual.\n\nTo carry it we created a little world with its own cast. On a planet full of threats, our hero Sam sets out to protect her Galaxy through a series of missions, discovering hidden places, taking those missions to other worlds, and sharing everything she learns along the way. The pixel art look gave it a game feel that matched both the platform and the audience."

  short: "CPC, Social & Community",

  seamless: true,

.aboutwin{display:flex;height:100%;min-height:0;}
.aboutwin-side{flex:0 0 clamp(104px,30%,176px);background:rgba(246,246,248,0.72);border-right:0.5px solid rgba(0,0,0,0.1);padding:22px 12px;display:flex;flex-direction:column;gap:3px;}
.aboutwin-side-title{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9a9aa0;margin:0 0 12px 10px;}
.aboutwin-tab{display:block;width:100%;text-align:left;font-size:14.5px;font-weight:600;color:#3a3a3c;background:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;}
.aboutwin-tab:hover{background:rgba(0,0,0,0.055);}
.aboutwin-tab.active{background:#0a7bff;color:#fff;}
.aboutwin-main{flex:1;min-width:0;overflow:auto;}
.aboutwin-main .about-doc{padding:46px 46px 54px;max-width:560px;}
.free-doc{padding:24px 26px 32px;}
.free-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,0.6);border:0.5px solid rgba(0,0,0,0.08);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(20,20,50,0.08);}
.free-thumb{flex:0 0 140px;height:140px;border-radius:12px;background-color:#1c1c1e;background-size:cover;background-position:center;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.25);}
.free-info{flex:1;min-width:200px;}
.free-title{margin:0 0 6px;font-size:15px;font-weight:700;color:#1d1d1f;}
.free-desc{margin:0 0 14px;font-size:13px;line-height:1.55;color:#4a4a50;}
.free-dl{display:inline-flex;align-items:center;font-size:13.5px;font-weight:700;color:#0a64d6;text-decoration:none;padding:9px 16px;border-radius:10px;background:rgba(10,100,214,0.1);transition:background .15s;}
.free-dl:hover{background:rgba(10,100,214,0.18);}
.free-card + .free-card{margin-top:16px;}

/* Contact */
.contact-doc{padding:44px 48px 48px;max-width:540px;}
.contact-h1{font-family:"New York",Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-0.4px;margin:0 0 14px;color:#161617;}
.contact-lead{font-size:16px;line-height:1.65;color:#3d3d40;margin:0 0 26px;}
.contact-sub{font-size:14.5px;line-height:1.6;color:#86868b;margin:0 0 12px;}
.contact-sent{display:flex;flex-direction:column;align-items:flex-start;gap:6px;justify-content:center;}
.sent-check{width:54px;height:54px;border-radius:50%;background:#28c840;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 20px rgba(40,200,64,0.34);}
.form{display:flex;flex-direction:column;gap:18px;margin-top:24px;}
.field{display:flex;flex-direction:column;gap:8px;}
.field-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#86868b;}
.field-input{font-family:inherit;font-size:15px;color:#1d1d1f;background:#fff;border:1px solid #dcdce2;border-radius:11px;padding:13px 15px;outline:none;transition:border .15s,box-shadow .15s;width:100%;}
.field-input:focus{border-color:#0a7bff;box-shadow:0 0 0 3px rgba(10,123,255,0.16);}
.field-area{resize:none;line-height:1.55;}
.sketch-block{display:flex;flex-direction:column;gap:9px;}
.sketch-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sketch-tools{display:flex;align-items:center;gap:6px;}
.tool-btn{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid #dcdce2;background:#fff;border-radius:8px;cursor:pointer;color:#3a3a3c;transition:.12s;}
.tool-btn svg{width:16px;height:16px;display:block;}
.tool-btn:hover{background:#f1f4f9;border-color:#c3c8d2;}
.tool-btn.active{background:#0a7bff;border-color:#0a7bff;color:#fff;}
.sketch-clear{font-size:12px;font-weight:600;color:#0a7bff;background:rgba(10,123,255,0.1);border:0;border-radius:8px;padding:6px 13px;cursor:pointer;}
.sketch-clear:hover{background:rgba(10,123,255,0.18);}
.sketch-canvas{width:100%;height:185px;background:#fff;border:1px solid #dcdce2;border-radius:14px;cursor:crosshair;touch-action:none;box-shadow:inset 0 2px 6px rgba(0,0,0,0.06);}
.checkbox-row{display:flex;align-items:center;gap:11px;font-size:14.5px;color:#3d3d40;cursor:pointer;}
.checkbox-row input{width:18px;height:18px;accent-color:#0a7bff;}
.primary-btn{margin-top:4px;font-size:15px;font-weight:700;color:#fff;background:#0a7bff;border:0;border-radius:12px;padding:14px 24px;cursor:pointer;box-shadow:0 6px 16px rgba(10,123,255,0.32);transition:background .15s,transform .1s;}
.primary-btn:hover{background:#0a64d6;}
.primary-btn:active{transform:scale(0.99);}
.primary-btn:disabled{opacity:.6;cursor:default;}
.form-note{font-size:11.5px;color:#9b9ba1;margin:2px 0 0;}
.form-note.err{color:#d9472b;}.form-note.ok{color:#1a8a4a;}
.contact-links{display:flex;gap:10px;margin-top:30px;border-top:1px solid #ececf0;padding-top:24px;}
.req{color:#ff5f57;font-weight:800;}
.field-err{border-color:#ff5f57 !important;box-shadow:0 0 0 3px rgba(255,95,87,0.16) !important;}
.contact-outro{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:32px;border-top:1px solid #ececf0;padding-top:26px;}
.contact-outro-text{font-size:13.5px;color:#86868b;font-weight:600;}
.linkedin-btn{display:inline-flex;align-items:center;gap:11px;text-decoration:none;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(180deg,#0a85ff,#0a66c2);padding:13px 20px;border-radius:13px;box-shadow:0 8px 20px rgba(10,102,194,0.36);transition:transform .12s,box-shadow .15s;}
.linkedin-btn:hover{transform:translateY(-1px);box-shadow:0 11px 26px rgba(10,102,194,0.46);}
.li-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:#fff;color:#0a66c2;font-size:14px;font-weight:900;}
.contact-link{display:flex;align-items:center;gap:9px;text-decoration:none;color:#2c2c2e;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:11px;background:rgba(0,0,0,0.04);border:0.5px solid rgba(0,0,0,0.06);transition:.15s;}
.contact-link:hover{background:rgba(10,100,214,0.1);color:#0a64d6;}
.cl-glyph{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:rgba(10,100,214,0.12);font-size:12px;font-weight:800;}

/* Work, projects only, large grid */
.work-grid-wrap{padding:26px 28px 32px;}
.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;}
.work-item{display:flex;flex-direction:column;align-items:center;gap:11px;background:none;border:0;cursor:pointer;padding:8px;border-radius:12px;transition:.15s;}
.work-item:hover{background:rgba(10,100,214,0.08);}
.work-item.static{cursor:default;}
.work-label{font-size:12px;font-weight:600;color:#333;text-align:center;line-height:1.3;word-break:break-word;}
.bin-note{font-size:13.5px;color:#6a6a70;margin:0 0 20px;font-weight:500;padding:0 8px;}

/* CV */
.cv-doc{padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cv-page{background:#fff;width:100%;max-width:430px;padding:32px 36px;border-radius:6px;box-shadow:0 12px 34px rgba(20,20,50,0.18);font-size:13px;color:#2c2c2e;line-height:1.55;}
.cv-name{font-size:20px;font-weight:800;letter-spacing:1px;margin:0;}
.cv-sub{color:#86868b;font-weight:600;margin:4px 0 0;font-size:12.5px;}
.cv-contact{color:#9b9ba1;font-size:11px;margin:8px 0 0;line-height:1.5;}
.cv-dim{color:#86868b;font-size:12px;margin:3px 0 0;}
.cv-page hr{border:0;border-top:1px solid #eee;margin:18px 0;}
.cv-page h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#0a64d6;margin:18px 0 6px;}
.cv-page p{margin:5px 0;}
.cv-download{font-size:14px;font-weight:700;color:#0a64d6;text-decoration:none;padding:11px 20px;border-radius:11px;background:rgba(10,100,214,0.1);}
.cv-download:hover{background:rgba(10,100,214,0.18);}

/* Error */
.error-dialog{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px;height:100%;justify-content:center;}
.error-badge{font-size:44px;margin-bottom:8px;}
.error-title{font-size:16px;font-weight:800;margin:0 0 8px;color:#1d1d1f;}
.error-body{font-size:13.5px;color:#555;line-height:1.55;margin:0 0 22px;max-width:300px;}
.error-ok{font-size:13.5px;font-weight:700;color:#fff;background:#0a7bff;border:0;border-radius:9px;padding:9px 22px;cursor:pointer;}
.error-ok:hover{background:#0a64d6;}

/* dock */
.dock-wrap{position:absolute;left:0;right:0;bottom:34px;z-index:100000;display:flex;justify-content:center;pointer-events:none;}
.dock{display:flex;align-items:flex-end;gap:9px;padding:9px 13px;background:rgba(255,255,255,0.32);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border-radius:24px;border:0.5px solid rgba(255,255,255,0.55);box-shadow:0 20px 48px rgba(20,20,50,0.32),inset 0 0 0 0.5px rgba(255,255,255,0.3);pointer-events:auto;max-width:96vw;}
.dock-sep{width:1px;height:48px;background:rgba(0,0,0,0.15);margin:0 3px;align-self:center;}
.dock-item{position:relative;background:none;border:0;padding:0;cursor:pointer;transform-origin:bottom center;transition:transform .12s ease;}
.dock-tile{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:13px;overflow:hidden;box-shadow:0 6px 14px rgba(20,20,50,0.24),inset 0 0 0 0.5px rgba(255,255,255,0.28);}
.dock-tile.finder svg{display:block;}
.dock-img{width:54px;height:54px;object-fit:contain;display:block;filter:drop-shadow(0 6px 9px rgba(20,20,50,0.32));pointer-events:none;}
.dock-tip{position:absolute;bottom:calc(100% + 13px);left:50%;transform:translateX(-50%);background:rgba(40,40,45,0.94);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease;}
.dock-tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(40,40,45,0.94);}
.dock-item:hover .dock-tip{opacity:1;}

/* Welcome notification (macOS style, first visit only) */
.notif{position:fixed;top:14px;right:14px;z-index:100001;width:384px;max-width:calc(100vw - 28px);display:flex;gap:11px;align-items:flex-start;padding:13px 16px 14px 16px;border-radius:18px;cursor:pointer;color:#1d1d1f;
  background:rgba(246,246,248,0.80);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 0 0 0.5px rgba(0,0,0,0.13),0 14px 40px -8px rgba(20,20,40,0.38),0 2px 6px rgba(0,0,0,0.08);}
.notif-in{animation:notifIn .6s cubic-bezier(.2,.9,.25,1.04) both;}
.notif-out{animation:notifOut .32s ease forwards;}
@keyframes notifIn{from{opacity:0;transform:translateX(calc(100% + 30px));}to{opacity:1;transform:none;}}
@keyframes notifOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateX(calc(100% + 30px));}}
.notif-body{min-width:0;flex:1;}
.notif-head{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.3px;color:#6e6e73;margin-bottom:3px;}
.notif-title{font-size:13.5px;font-weight:700;line-height:1.3;}
.notif-text{font-size:13px;line-height:1.4;color:#3a3a3c;margin-top:2px;text-wrap:pretty;}
.notif-close{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;font-size:14px;line-height:22px;color:#444;
  background:rgba(250,250,252,0.96);box-shadow:0 0 0 0.5px rgba(0,0,0,0.2),0 2px 6px rgba(0,0,0,0.16);opacity:0;transition:opacity .15s ease;}
.notif:hover .notif-close{opacity:1;}
@media (hover: none){.notif-close{opacity:1;}}
@media (max-width: 768px){
  .notif{top:10px;left:10px;right:10px;width:auto;max-width:none;}
  .notif-in{animation-name:notifInTop;}.notif-out{animation-name:notifOutTop;}
}
@keyframes notifInTop{from{opacity:0;transform:translateY(calc(-100% - 20px));}to{opacity:1;transform:none;}}
@keyframes notifOutTop{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(calc(-100% - 20px));}}
@media (prefers-reduced-motion: reduce){.notif-in,.notif-out{animation-duration:.01s;}}

/* Window text can be selected and copied (emails, names, project info) */
.window-body p,.window-body h1,.window-body h2,.window-body h3,.window-body li,.window-body a,.form-note{-webkit-user-select:text;user-select:text;}
/* Touch screens: dock labels flash briefly on tap instead of staying stuck over the content */
@keyframes tipFlash{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
@media (hover: none){.dock-item:hover .dock-tip{opacity:0;animation:tipFlash 1.6s ease forwards;}}

/* ============================ MOBILE ONLY ============================ */
@media (max-width: 1024px){.wallpaper{background-image:none !important;background:${MOBILE_BG} !important;background-size:cover !important;background-position:center !important;}/* Dock: barra vertical izquierda en móvil/tablet (≤1024px) */.dock-wrap{left:0;right:auto;bottom:auto;top:50%;transform:translateY(-50%);justify-content:flex-start;}.dock{flex-direction:column;align-items:center;gap:7px;padding:10px 7px;border-radius:19px;margin-left:7px;max-width:none;overflow:visible;}.dock-item{transform:none !important;transition:none !important;transform-origin:left center;}.dock-tile{width:44px;height:44px;border-radius:11px;}.dock-img{width:44px;height:44px;}.dock-sep{width:30px;height:1px;margin:3px 0;align-self:center;}.tl.yellow{display:none !important;}.dock-tip{bottom:auto;top:50%;left:calc(100% + 10px);transform:translateY(-50%);}.dock-tip::after{top:50%;left:auto;right:100%;transform:translateY(-50%);border:5px solid transparent;border-right-color:rgba(40,40,45,0.94);border-top-color:transparent;}}

  @media (max-width: 768px){
  /* About Me en movil: pestanas arriba (horizontal) para que el texto quepa */
  .aboutwin{flex-direction:column;}
  .aboutwin-side{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;gap:6px;border-right:0;border-bottom:0.5px solid rgba(0,0,0,0.1);padding:8px 12px;overflow-x:auto;}
  .aboutwin-side-title{display:none;}
  .aboutwin-tab{width:auto;padding:7px 14px;white-space:nowrap;}
  .aboutwin-main p{overflow-wrap:break-word;}
  .about-h1{font-size:clamp(28px,8.4vw,40px);}
  .aboutwin-tab{padding:7px 12px;}

  /* Contact: sketch tools wrap instead of overflowing the window */
  .sketch-head{flex-wrap:wrap;row-gap:10px;}
  .sketch-tools{flex-wrap:wrap;}

  /* Ocultar minimizar en movil (no hay barra para recuperar la ventana) */
  .tl.yellow{display:none !important;}

  /* Free Stuff: apilar tarjeta en movil para que el texto no se corte */
  .free-card{flex-direction:column;align-items:stretch;}.free-thumb{width:100%;height:150px;flex:0 0 auto;}.free-info{min-width:0;width:100%;}

  /* 4. Wallpaper móvil (placeholder reemplazable via MOBILE_BG) */
  .wallpaper{background-image:none !important;background:${MOBILE_BG} !important;background-size:cover !important;background-position:center !important;}

  /* 3. Elementos del escritorio (iconos, documentos, miniaturas) más pequeños */
  .desk-icon{transform:translate(-50%,-50%) scale(0.82) !important;width:92px;gap:5px;padding:4px;}
  .desk-icon:hover{transform:translate(-50%,-50%) scale(0.82) !important;}
  .desk-label{font-size:12px;line-height:1.25;max-width:160px;padding:3px 7px;white-space:normal;word-break:normal;overflow-wrap:normal;}

}
